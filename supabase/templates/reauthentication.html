<!-- Supabase → Authentication → Emails → Reauthentication. Betreff: Ihr Bestätigungscode für XPORTAL -->
<div style="margin:0;padding:32px 16px;background:#f7f6f3;font-family:Inter,Helvetica,Arial,sans-serif;color:#0e1411">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e6e9e7;border-radius:20px;padding:32px">
    <p style="margin:0 0 24px;font-size:15px;font-weight:600;letter-spacing:0.12em">XPORTAL</p>
    <h1 style="margin:0 0 12px;font-size:24px;font-weight:500;letter-spacing:-0.02em">Ihr Bestätigungscode</h1>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.55;color:#4b524e">Geben Sie diesen Code auf XPORTAL ein, um die Änderung zu bestätigen:</p>
    <p style="margin:0 0 28px;font-size:30px;font-weight:600;letter-spacing:0.18em">{{ .Token }}</p>
    <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#7c847f">Sie haben keinen Code angefordert? Dann ignorieren Sie diese Mail.</p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#7c847f">English: Enter this code on XPORTAL to confirm the change.</p>
  </div>
</div>
