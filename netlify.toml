# Next.js auf Netlify: Seiten und /api laufen über den OpenNext-Adapter (@netlify/plugin-nextjs).
# Er ist hier ausdrücklich eingebunden, weil Uploads ohne Git ihn nicht automatisch installieren.
# Variablen (Supabase, OpenAI, …) stehen in der Netlify-Oberfläche, nicht hier.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Indexierung nicht hier einschalten. In der Netlify-Oberfläche nur für Production:
#   SITE_INDEXABLE = "true"
#   NEXT_PUBLIC_SITE_URL = "https://x-portal.eu"
# Deploy Previews und Branch Deploys bleiben noindex (Code und Netlify).
# Stand 19.11.2026 sendet https://x-portal.eu noch X-Robots-Tag: noindex, nofollow.

[[plugins]]
  package = "@netlify/plugin-nextjs"
